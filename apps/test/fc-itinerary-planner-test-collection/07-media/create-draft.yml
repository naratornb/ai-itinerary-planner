info:
  name: create-draft
  type: http
  seq: 1

http:
  method: POST
  url: "{{host-api}}/packages"
  headers:
    - name: content-type
      value: application/json
    - name: accept
      value: application/json
  auth:
    type: bearer
    token: "{{access-token}}"
  body:
    type: json
    data: |-
      {
        "title": "Smoke Test Media Draft",
        "description": "Automated smoke test draft for media.",
        "destination_country": "Japan",
        "destination_city": "Tokyo",
        "duration_days": 3,
        "base_price_aud": 1500
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        test("creates a minimal draft", function() {
          expect(res.body.status).to.equal("draft");
        });
    - type: after-response
      code: |-
        bru.setVar("media-package-id", res.body.package_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
