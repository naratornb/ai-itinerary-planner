info:
  name: list
  type: http
  seq: 4

http:
  method: GET
  url: "{{host-api}}/media/{{media-package-id}}"
  headers:
    - name: accept
      value: application/json
  auth:
    type: bearer
    token: "{{access-token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("lists exactly the uploaded media", function() {
          expect(res.body.total).to.equal(1);
          expect(res.body.data[0].media_id).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
