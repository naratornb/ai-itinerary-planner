info:
  name: package-detail
  type: http
  seq: 1
http:
  method: GET
  url: "{{host-api}}/marketplace/packages/b0000000-0000-0000-0000-000000000001"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the requested package", function() {
          expect(res.body.package_id).to.equal("b0000000-0000-0000-0000-000000000001");
        });
        test("only live packages are public", function() {
          expect(res.body.status).to.equal("live");
        });
        test("component collections are arrays", function() {
          ["flights", "hotels", "activities", "media", "days"].forEach(function(key) {
            expect(res.body[key]).to.be.an("array");
          });
        });
        test("pricing breakdown is present and consistent", function() {
          var p = res.body.pricing;
          expect(p).to.be.an("object");
          ["flights_total", "hotels_total", "activities_total", "components_total"].forEach(function(key) {
            expect(p[key]).to.be.a("number");
          });
          expect(p.components_total).to.equal(p.flights_total + p.hotels_total + p.activities_total);
          // Seeded package has priced components; 0 here means the sums broke
          expect(p.hotels_total).to.be.greaterThan(0);
          expect(p.components_total).to.be.greaterThan(0);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
