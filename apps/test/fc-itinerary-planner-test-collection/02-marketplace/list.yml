info:
  name: list
  type: http
  seq: 2

http:
  method: GET
  url: "{{host-api}}/marketplace/packages"
  headers:
    - name: accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the first page of live packages", function() {
          expect(res.body.data).to.be.an("array");
          expect(res.body.meta.page).to.equal(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
