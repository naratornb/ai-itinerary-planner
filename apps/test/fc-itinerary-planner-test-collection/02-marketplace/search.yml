info:
  name: search
  type: http
  seq: 3

http:
  method: GET
  url: "{{host-api}}/marketplace/search?q=Tokyo"
  headers:
    - name: accept
      value: application/json
  params:
    - name: q
      value: Tokyo
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("echoes the query and returns results", function() {
          expect(res.body.query).to.equal("Tokyo");
          expect(res.body.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
