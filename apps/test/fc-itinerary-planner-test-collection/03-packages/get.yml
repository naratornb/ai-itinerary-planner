info:
  name: get
  type: http
  seq: 3

http:
  method: GET
  url: "{{host-api}}/packages/{{package-id}}"
  headers:
    - name: accept
      value: application/json
  auth:
    type: bearer
    token: "{{access-token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the created draft in full", function() {
          expect(res.body.package_id).to.equal(bru.getVar("package-id"));
          expect(res.body.latest_approval).to.be.null;
          expect(res.body.flights).to.have.lengthOf(1);
          expect(res.body.hotels).to.have.lengthOf(1);
          expect(res.body.activities).to.have.lengthOf(1);
        });
        test("pricing breakdown is present and consistent", function() {
          var p = res.body.pricing;
          expect(p).to.be.an("object");
          expect(p.components_total).to.equal(p.flights_total + p.hotels_total + p.activities_total);
          // The created draft has priced flight/hotel/activity components
          expect(p.components_total).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
