info:
  name: approve-not-found
  type: http
  seq: 1

http:
  method: POST
  url: "{{host-api}}/approvals/00000000-0000-0000-0000-000000000000/approve"
  headers:
    - name: content-type
      value: application/json
    - name: accept
      value: application/json
  auth:
    type: bearer
    token: "{{admin-access-token}}"
  body:
    type: json
    data: |-
      {}

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
  scripts:
    - type: tests
      code: |-
        test("unknown package is not found", function() {
          expect(res.body.error_code).to.equal("NOT_FOUND");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
