info:
  name: health
  type: http
  seq: 1
http:
  method: GET
  url: "{{host-api}}/health"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("status is ok", function() {
          expect(res.body.status).to.equal("ok");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
