info:
  name: list-users
  type: http
  seq: 1

http:
  method: GET
  url: "{{host-api}}/users"
  auth:
    type: bearer
    token: "{{access-token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("users is an array", function() {
          expect(res.body.users).to.be.an("array");
        });

        test("first user has id and email", function() {
          if (res.body.users.length > 0) {
            expect(res.body.users[0]).to.have.property("id");
            expect(res.body.users[0]).to.have.property("email");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
