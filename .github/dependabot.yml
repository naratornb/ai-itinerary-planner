version: 2
updates:
  # ponytail: paused during implementation — remove open-pull-requests-limit lines to re-enable
  - package-ecosystem: npm
    directory: /apps/web
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /apps/api
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
